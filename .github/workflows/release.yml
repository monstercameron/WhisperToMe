name: Build & Release EXE

# Manual-only: trigger from the Actions tab ("Run workflow"). Builds the one-file
# Windows-on-ARM (Snapdragon) executable and publishes it as a GitHub Release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    # ARM64 Windows runner so onnxruntime-qnn and the QNN HTP libs match the target.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up ARM64 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[qnn]"
          pip install "pyinstaller>=6.10"

      - name: Build one-file exe
        run: pyinstaller whispertome.spec --noconfirm --clean

      - name: Name the artifact
        shell: pwsh
        run: Copy-Item dist/whispertome.exe "dist/whispertome-${{ inputs.tag }}-win-arm64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whispertome-win-arm64
          path: dist/whispertome-${{ inputs.tag }}-win-arm64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: WhisperToMe ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/whispertome-${{ inputs.tag }}-win-arm64.exe
          body: |
            WhisperToMe — one-file build for **Windows on ARM (Snapdragon X2 Elite)**.

            Bundles Python, ONNX Runtime + QNN HTP libraries, PortAudio, libsndfile, and Tcl/Tk.
            Model artifacts are **not** included — place a `models/` folder and `.env` next to the
            exe and point at them with `--project-root`. First Supertonic run compiles the QNN
            context into `artifacts/supertonic_static/` (cached afterward).

            ```powershell
            whispertome-${{ inputs.tag }}-win-arm64.exe --project-root C:\path\to\whispertome desktop --wake "computer"
            ```
